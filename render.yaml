databases:
  # Users only — document metadata and chunk embeddings stay in Qdrant. No `plan:` set: Render's
  # free/lowest Postgres tier changes over time, so check the dashboard and adjust if needed.
  - name: ai-doc-qna-db
    databaseName: ai_doc_qna
    user: ai_doc_qna

services:
  - type: web
    name: ai-doc-qna-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Wired automatically from the database above — nothing to enter in the dashboard.
      - key: DB_HOST
        fromDatabase:
          name: ai-doc-qna-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ai-doc-qna-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ai-doc-qna-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: ai-doc-qna-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ai-doc-qna-db
          property: password
      # Secrets and per-environment values — sync: false means Render prompts for these in the
      # dashboard instead of expecting a committed value.
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: QDRANT_HOST
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Fixed values for this deployment shape (Qdrant Cloud, cookies over real HTTPS).
      - key: QDRANT_PORT
        value: "6334"
      - key: QDRANT_USE_TLS
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
