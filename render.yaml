services:
  - type: web
    name: ai-doc-qna-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Secrets and per-environment values — sync: false means Render prompts for these in the
      # dashboard instead of expecting a committed value.
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: QDRANT_HOST
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Fixed values for this deployment shape (Qdrant Cloud, cookies over real HTTPS).
      - key: QDRANT_PORT
        value: "6334"
      - key: QDRANT_USE_TLS
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
