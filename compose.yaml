services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-doc-qna-postgres
    environment:
      POSTGRES_DB: ai_doc_qna
      POSTGRES_USER: ai_doc_qna
      POSTGRES_PASSWORD: ai_doc_qna
    ports:
      # 5433 is taken by an unrelated container on this machine.
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_doc_qna -d ai_doc_qna"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ai-doc-qna-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
