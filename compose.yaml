services:
  postgres:
    image: postgres:17
    container_name: ai-doc-qna-postgres
    environment:
      POSTGRES_DB: ai_doc_qna
      POSTGRES_USER: ai_doc_qna
      POSTGRES_PASSWORD: ai_doc_qna
    ports:
      # 5433 is taken by an unrelated container on this machine.
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_doc_qna -d ai_doc_qna"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: ai-doc-qna-qdrant
    ports:
      - "6333:6333"   # REST API + web dashboard
      - "6334:6334"   # gRPC API — what the Spring AI client actually talks to
    volumes:
      - qdrant-data:/qdrant/storage
    # No healthcheck: the image ships no shell utility (no curl/wget/nc) to probe an HTTP
    # endpoint with, and nothing else in this file depends_on it.

volumes:
  postgres-data:
  qdrant-data:
