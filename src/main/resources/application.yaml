spring:
  application:
    name: ai-doc-qna

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ai_doc_qna}
    username: ${DB_USER:ai_doc_qna}
    password: ${DB_PASSWORD:ai_doc_qna}

  jpa:
    hibernate:
      # Flyway owns the schema. `validate` fails fast when an entity and a migration disagree.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  data:
    web:
      pageable:
        default-page-size: 20
        # Without a cap, one request can pull the whole corpus.
        max-page-size: 100

  threads:
    virtual:
      enabled: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        # Spring AI 2.0 flattened these — there is no `.options` segment any more.
        model: gpt-4o-mini
        temperature: 0.0   # 2.0 removed the implicit 0.7 default; grounded QA wants determinism
        max-tokens: 1024
      embedding:
        model: text-embedding-3-small
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}   # gRPC, not the 6333 REST/dashboard port
        use-tls: ${QDRANT_USE_TLS:false}
        # Blank locally (no auth on a local container); a managed instance (e.g. Qdrant Cloud)
        # needs QDRANT_API_KEY set, or every request fails with an authentication error.
        api-key: ${QDRANT_API_KEY:}
        collection-name: vector_store
        # The store creates its own collection (dimension 1536, cosine distance) on startup.
        # Document metadata lives in Qdrant too (see QdrantCollectionsInitializer), but that's
        # plain application code, not something this flag reaches. Users live in Postgres.
        initialize-schema: true

app:
  ingestion:
    chunk-size-tokens: 800
    min-chunk-size-chars: 350
    max-file-size-bytes: 52428800   # 50 MB, mirrors spring.servlet.multipart
    allowed-content-types:
      - application/pdf
      - text/plain
      - text/markdown
  qa:
    top-k: 6
    # Cosine similarity floor. Below this, chunks are treated as irrelevant and the
    # question is refused without spending a chat call.
    similarity-threshold: 0.45
    max-snippet-chars: 320
  jwt:
    # Dev-only fallback (decodes to 256 bits) so local runs and tests don't require setting
    # JWT_SECRET. Always override this in any shared or production environment.
    secret: ${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24hISE=}
    access-token-expiry-ms: 900000      # 15 minutes
    refresh-token-expiry-ms: 604800000  # 7 days
    # False so local http://localhost dev works. Any real deployment must set COOKIE_SECURE=true.
    cookie-secure: ${COOKIE_SECURE:false}
  cors:
    # Vite's default dev port. Override/extend with a comma-separated list via CORS_ALLOWED_ORIGINS
    # for any other frontend origin (a different dev port, a deployed frontend domain, etc.).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5175}

logging:
  level:
    com.utkarsh.ai_doc_qna: DEBUG

server:
  # Render (and most PaaS hosts) assign the listen port via $PORT at runtime; local dev keeps
  # using 8085 since nothing sets that env var here.
  port: ${PORT:8085}
